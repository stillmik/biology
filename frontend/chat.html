<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat · Biology Chat</title>
    <link rel="stylesheet" href="styles.css?v=6" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar"><div class="sidebar-heading"><strong>Chats</strong><button id="new-chat" type="button">+</button></div><div id="conversations" class="conversation-list"></div><a class="switch-user" href="/register.html">Switch user</a></aside>
      <section class="shell"><div class="chat-topbar"><span id="username"></span><span id="chat-title"></span></div><section id="messages" class="messages" aria-live="polite"></section><form id="chat-form" class="composer"><label class="sr-only" for="message-input">Your message</label><textarea id="message-input" rows="2" maxlength="690" placeholder="Write a message..." required></textarea><button type="submit">Send</button></form><p id="status" class="status" role="status"></p></section>
    </main>
    <script src="chat.js?v=8"></script>
  </body>
</html>
